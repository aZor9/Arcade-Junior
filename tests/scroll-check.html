<!doctype html><meta charset="utf-8"><body><pre id="out"></pre><script type="module">
import { ALL_GAMES as GAMES } from '../js/games/index.js';
import { createRng } from '../js/rng.js';
const q = new URLSearchParams(location.search);
const W = Number(q.get('w') || 1280), H = Number(q.get('h') || 720);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
localStorage.clear();
if (q.get('labs')) localStorage.setItem('aj:settings', JSON.stringify({ labs: true })); // accueil rangé par catégories
const routes = [['accueil', 'index.html'], ['profil', 'index.html#/profil'], ['à propos', 'about.html'], ['confidentialité', 'privacy.html'], ['légal', 'legal.html']];
for (const g of (q.get('nosess') ? [] : GAMES)) for (const d of g.difficulties) {
  const id = (g.id + d.id).replace(/[^a-z0-9]/g, '');
  const s = { id, game: g.id, diff: d.id, seed: 1, createdAt: Date.now(), updatedAt: Date.now(), elapsed: 0, state: g.create(createRng(7), d.id) };
  localStorage.setItem('aj:s:' + id, JSON.stringify(s));
  routes.push([g.id + '/' + d.id, `index.html#/jeu/${g.id}/${id}`]);
}
const out = [];
const f = document.createElement('iframe'); f.style.cssText = `width:${W}px;height:${H}px;border:0`; document.body.append(f);
let n = 0;
for (const [name, url] of routes) {
  const u = url.replace(/^([^#]*)/, '$1?t=' + (++n));
  f.src = '../' + u; await new Promise((r) => { f.onload = r; });
  // ?text=1.125 : texte agrandi (réglage « grand texte » des téléphones, polices plus larges selon le système).
  if (q.get('text')) f.contentDocument.documentElement.style.fontSize = (100 * Number(q.get('text'))) + '%';
  await sleep(250);
  const de = f.contentDocument.documentElement;
  const over = de.scrollHeight - f.contentWindow.innerHeight;
  const side = f.contentDocument.querySelector('.sidebar');
  // Débordement horizontal : la page ne doit jamais être plus large que l'écran (téléphone compris).
  const wide = de.scrollWidth - de.clientWidth;
  // En cas de débordement, on nomme l'élément fautif (le plus profond qui dépasse), pour corriger sans deviner.
  const culprit = wide > 1 ? [...f.contentDocument.querySelectorAll('body *')].reverse()
    .find((e) => e.getBoundingClientRect().right > de.clientWidth + 1 && !e.closest('.cat-chips')) : null;
  out.push((over > 1 ? 'SCROLL +' + over : 'ok       ') + '  ' + name + (wide > 1 ? `  WIDE +${wide}${culprit ? ` (${culprit.tagName.toLowerCase()}.${culprit.className})` : ''}` : '') + (side && side.scrollHeight > side.clientHeight + 1 ? '  (menu déborde +' + (side.scrollHeight - side.clientHeight) + ')' : ''));
}
document.getElementById('out').textContent = out.join(String.fromCharCode(10));
</script>
